<!doctype html>
<html lang="th">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="text-scale" content="scale" />
		<meta
			name="description"
			content="สรุปเนื้อหาและแบบทดสอบ 100 ข้อ สำหรับทบทวนก่อนสอบ AWS Cloud, RAG/LangChain และ IP Subnetting"
		/>
		<meta name="theme-color" content="#fbfaf6" />
		<title>AWS-Quiz-CPE — ทบทวนสอบ AWS · RAG · Subnetting</title>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('quiz_theme');
					var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
					if (saved === 'dark' || (!saved && prefersDark)) {
						document.documentElement.classList.add('dark');
						var meta = document.querySelector('meta[name="theme-color"]');
						if (meta) meta.setAttribute('content', '#121316');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
